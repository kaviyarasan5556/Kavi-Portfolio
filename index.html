<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Values between percent signs are filled in by vite.config.js from src/data/profile.js and VITE_SITE_URL. -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="author" content="%PERSON_NAME%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PERSON_NAME%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="%SEO_IMAGE_ALT%" />

    <script type="application/ld+json">
      %PERSON_JSON_LD%
    </script>

    <!--
      Runs before the first paint: applies the saved theme, and marks the intro
      as already seen (once per browser session) or unwanted (reduced motion).
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
          var r = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (r || sessionStorage.getItem('intro')) d.dataset.skipIntro = '';
          else sessionStorage.setItem('intro', '1');
        } catch (e) {}
      })();
    </script>

    <!-- Page colour before the stylesheet arrives, so there is no white flash. -->
    <style>
      html {
        background: #0b0b0c;
        color: #edebe6;
      }
      html[data-theme='light'] {
        background: #f4f1ea;
        color: #141413;
      }
      .no-js {
        max-width: 34rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      .no-js a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="no-js">
        <h1>%PERSON_NAME%</h1>
        <p>%SEO_DESCRIPTION%</p>
        <p>
          This site needs JavaScript to run. You can still
          <a href="%RESUME_HREF%">download my CV</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
